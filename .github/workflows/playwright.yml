name: Playwright - run all end-to-end tests
on:
    workflow_call:
        inputs:
            browser:
                description: 'Playwright project to run (chromium, webkit, ...)'
                type: string
                default: chromium
            runner:
                description: 'GitHub runner to run on (ubuntu-latest, macos-latest, ...)'
                type: string
                default: ubuntu-latest
            workers:
                description: 'Playwright workers per shard. 1 serializes specs against the single Firebase emulator (less contention/flakiness), at the cost of wall-clock.'
                type: string
                default: '2'

jobs:
    test:
        name: test (${{ inputs.browser }} ${{ matrix.shard }}/${{ strategy.job-total }})
        timeout-minutes: 60
        runs-on: ${{ inputs.runner }}
        # Split the tests into five parallel shards. Each shard pays the same
        # fixed setup (~140s: npm ci, build, browser cache, emulator startup),
        # so a shard's wall clock is that floor plus its share of the suite's
        # test-seconds over its two workers. Which tests a shard runs is dealt
        # out by scripts/e2e-shard.ts rather than Playwright's `--shard`, which
        # cuts contiguous runs in file order and so handed the slow accessibility
        # specs to one shard however many there were. More shards, unlike more
        # workers, add no emulator contention, since each shard starts its own,
        # and runners are free on a public repository. The shard count is the
        # matrix's length, read back as `strategy.job-total`, so the name and the
        # deal can't disagree with it. fail-fast is off so one shard's failure
        # doesn't cancel the others' reports (the deploy gate already fails if
        # any shard fails).
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            # No postinstall on a cache hit: `npm run build` below generates
            # everything it would have.
            - uses: ./.github/actions/install
              with:
                  postinstall: 'false'
            - name: Resolve Playwright version
              id: playwright-version
              run: echo "version=$(npx playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browsers
              uses: actions/cache@v5
              with:
                  # The browser cache lives at a different path on Linux vs macOS;
                  # list both so the same step works on either runner (the key
                  # includes runner.os, so each OS keeps a separate entry).
                  path: |
                      ~/.cache/ms-playwright
                      ~/Library/Caches/ms-playwright
                  key: ${{ runner.os }}-ms-playwright-${{ inputs.browser }}-${{ steps.playwright-version.outputs.version }}
            - name: Install Playwright browsers
              # On a cache hit the browser binary is already present, so this is
              # a near-no-op; on a miss it downloads the binary. We omit
              # --with-deps: the ubuntu-latest image already ships the system
              # libraries Chromium needs, and reinstalling them via apt every run
              # cost ~15s. If a future runner image drops a dependency, add
              # --with-deps back (or `npx playwright install-deps`).
              run: npx playwright install ${{ inputs.browser }}
            - name: Install browser system dependencies
              # The step above deliberately skips these because the Linux image
              # already carries what Chromium needs. WebKit needs a different and
              # much larger set — gstreamer, libhyphen, libsecret — which the
              # image does not ship, and without them `browserType.launch` fails
              # outright: every test in a webkit-on-Linux run failed in 2-5ms
              # because no browser ever started. So install them for the one case
              # that needs them, rather than paying apt on every chromium PR.
              # Nothing to do on macOS, where the binary is self-contained.
              if: runner.os == 'Linux' && inputs.browser != 'chromium'
              run: npx playwright install-deps ${{ inputs.browser }}
            - run: echo "${{ secrets.ENV_DEMO }}" > .env
            - run: echo "${{ secrets.FUNCTIONS_ENV_DEMO }}" > functions/.env
            - name: Set up JDK 21 # Firebase emulator requires >=21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: 'temurin'
            - name: Cache Firebase emulators
              uses: actions/cache@v5
              with:
                  path: ~/.cache/firebase/emulators
                  # Include the lockfile hash so a firebase-tools bump invalidates
                  # the cached emulator jars instead of reusing stale ones.
                  key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-firebase-emulators-
            # `npm ci` at the root does not reach functions/ — there are no npm
            # workspaces — and `npm run build` ends with `cd functions && tsc`,
            # which needs functions/node_modules. This mirrors what
            # firebase.json's predeploy already does before deploying them.
            - name: Install functions dependencies
              run: npm ci --prefix functions
            # The emulators take ~15s to start, so they start before the build
            # rather than after it, as `emulators:exec` would; the build is
            # nearly a minute and they are ready long before it ends. Functions
            # are compiled first because the functions emulator loads them as it
            # starts (the build compiles them again, and it reloads). The hosting
            # emulator serves build/ as it changes, so it can start before there
            # is anything in it.
            #
            # `--only` leaves the Emulator UI out. `firebase.json` enables it for
            # local work, where it is genuinely useful; in CI nobody opens it and
            # it costs an extra Java and Node process per shard — which is worth
            # avoiding most on the 3-core macOS runner the WebKit nightly uses,
            # where contention is what the remaining flakes are made of.
            - name: Start the emulators
              run: |
                  npm run build --prefix functions
                  mkdir -p build
                  nohup npx firebase emulators:start --only auth,firestore,functions,hosting --project=demo-wordplay --log-verbosity QUIET > emulators.log 2>&1 &
            - name: Build project
              run: npm run build
            - name: Wait for the emulators
              run: |
                  for port in 9099 8080 5001 5002; do
                      if ! timeout 120 bash -c "until curl -s -o /dev/null http://127.0.0.1:$port; do sleep 1; done"; then
                          echo "The emulator on port $port never answered."
                          cat emulators.log
                          exit 1
                      fi
                  done
            # After the build, because listing the tests imports helpers that
            # read the assembled locale.
            - name: Choose this shard's tests
              run: npx tsx scripts/e2e-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }} --project=${{ inputs.browser }} > shard-tests.txt
            # The JSON report is written alongside the `list` output so the step
            # below can name the failed and flaky tests in the job summary, and
            # so scripts/e2e-timings.ts can refresh tests/e2e-timings.json from it.
            - name: Run end-to-end tests
              env:
                  PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
              run: npx playwright test --project=${{ inputs.browser }} $(tr '\n' ' ' < shard-tests.txt) --workers=${{ inputs.workers }} --reporter=list,json
            # Always: the summary is most wanted precisely when the step above
            # failed. The script exits 0 even with no report, so it can never
            # turn a green run red.
            # The budget is the whole chromium suite's test-seconds, divided
            # evenly because the shards split by test. Set at ~10% above the
            # suite as measured after it was last trimmed (1,750 test-seconds,
            # October 2026), so a PR that grows it past that is told so in its
            # own summary. It only warns; raise it deliberately, with a reason,
            # when growth is worth its cost. WebKit runs 2-3x slower and has no
            # budget.
            - name: Summarize failed and flaky tests
              if: always()
              env:
                  E2E_BUDGET_SECONDS: ${{ inputs.browser == 'chromium' && 1925 || '' }}
              run: npx tsx scripts/summarize-playwright.ts playwright-report.json "${{ inputs.browser }} shard ${{ matrix.shard }}/${{ strategy.job-total }}" ${E2E_BUDGET_SECONDS:+$((E2E_BUDGET_SECONDS / ${{ strategy.job-total }}))}
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: playwright-report-${{ inputs.browser }}-shard${{ matrix.shard }}
                  path: |
                      test-results/
                      playwright-report.json
                  retention-days: 30
                  # A fully green run writes nothing to test-results/ (traces are
                  # on-first-retry, screenshots only-on-failure), and a run that
                  # died early writes no report, so don't warn when either is
                  # missing.
                  if-no-files-found: ignore
