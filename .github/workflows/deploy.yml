name: Verify and deploy to Firebase
on:
    push:
        branches:
            - main
jobs:
    # Has a PR run already passed the whole suite on exactly this tree? Merging
    # a PR whose base was current produces the very tree its run tested (pr.yml's
    # `record` job names it), and re-running ten minutes of tests on identical
    # code can only repeat the answer. Anything else — main moved before the
    # merge, a conflict was resolved, a direct push — is a different tree, finds
    # no record, and is verified in full as before.
    #
    # Only a run from this repository counts. A pull_request run from a fork
    # runs the fork's own copy of pr.yml, so a fork could record a tree it never
    # tested; its merge is verified here instead.
    verified:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        outputs:
            skip: ${{ steps.lookup.outputs.skip }}
        steps:
            - uses: actions/checkout@v5
            - name: Look for a passing PR run on this tree
              id: lookup
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tree=$(git rev-parse HEAD^{tree})
                  runs=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=verified-tree-$tree" \
                      --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id] | join(" ")')
                  if [ -n "$runs" ]; then
                      echo "Tree $tree was verified by run(s) $runs; skipping the suite."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "No passing PR run on tree $tree; verifying in full."
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

    unit:
        needs: verified
        if: needs.verified.outputs.skip != 'true'
        uses: ./.github/workflows/unit.yml

    playwright:
        needs: verified
        if: needs.verified.outputs.skip != 'true'
        uses: ./.github/workflows/playwright.yml
        secrets: inherit

    deploy:
        needs: [verified, unit, playwright]
        # `always()` because a skipped need would otherwise skip this job too;
        # the rest says when to deploy: a verified tree, or a suite that passed.
        if: >-
            always() && needs.verified.result == 'success' &&
            (needs.verified.outputs.skip == 'true' ||
            (needs.unit.result == 'success' && needs.playwright.result == 'success'))
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            # Set up authentication for Firebase deployment using a service account
            - uses: 'google-github-actions/auth@v3'
              with:
                  credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WORDPLAY_PROD }}'

            # Install dependencies. firebase-tools is a devDependency, so this
            # also provides the `firebase` CLI (invoked via `npx` below) — no
            # separate global install needed.
            - run: npm ci
              name: Install dependencies

              # Set up environment variables from GitHub secrets
            - run: echo "${{ secrets.FUNCTIONS_ENV_PROD }}" > functions/.env
              name: Copy function environment variables
            - run: echo "${{ secrets.ENV_PROD }}" > .env.wordplay-prod
              name: Copy environment variables

            # Deploy functions, Firestore rules/indexes, and hosting in a single
            # command. Uses the firebase CLI rather than
            # FirebaseExtended/action-hosting-deploy, which had no Node 24
            # release (deprecated Node 20), and authenticates via the
            # google-github-actions/auth step above. One invocation lets the CLI
            # overlap the release phases; the predeploy hooks still build
            # functions (tsc) and the site (`npm run build:web`) before upload.
            #
            # Note: a combined deploy gives no ordering guarantee that functions
            # finish before hosting goes live, so there is a brief window where a
            # freshly deployed client could call not-yet-updated functions. This
            # is acceptable as long as function changes are backward-compatible;
            # if that stops holding, split functions into its own prior step.
            #
            # --force prunes functions that no longer exist in source. Without
            # it, a renamed/removed function lingers in the project (CI can't
            # answer the interactive deletion prompt) and keeps running its last
            # deployed code on its own schedule — the cause of the duplicate
            # contributor-update PRs.
            - run: npx firebase deploy --project wordplay-prod --force
              name: Deploy to Firebase
