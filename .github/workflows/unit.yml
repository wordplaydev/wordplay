name: Unit tests, type check, and locales
on:
    workflow_call:

permissions:
    contents: read

# Split into seven independent jobs that run concurrently. This work used to run
# as sequential steps in one job; as parallel jobs the wall-clock collapses
# to the longest single job instead of their sum. Each job repeats the
# checkout/setup-node/npm-ci preamble (cheap with the npm cache).
jobs:
    vitest:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            - run: npm run test:run
              name: Run vitest

    # The corpus sweeps (src/util/sweepTests.ts): five files re-deriving
    # static/examples and static/locales, which were 172 of the vitest job's 318
    # CPU-seconds and have nothing to do with the code most commits change. As a
    # sibling job they cost wall clock only when they are the longest one, and the
    # playwright gate is longer. WORDPLAY_SWEEP_CHANGED is deliberately unset here:
    # the pre-commit hook narrows to the locales a commit touched, but a parser or
    # conflict change can break a sweep while touching no corpus file, so CI runs
    # every locale.
    sweep:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            - run: npm run test:sweep
              name: Run the corpus sweeps

    # The Firestore security rules (tests/rules/**), which decide who may read and
    # write every collection and had run in no workflow at all until #907 — they
    # were a script someone had to remember. Its own job rather than a step in
    # `vitest` because it needs a JVM and the Firestore emulator, and as a
    # sibling it costs no wall clock: it finishes well inside the playwright gate.
    rules:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            - name: Set up JDK 21 # Firebase emulator requires >=21
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: 'temurin'
            - name: Cache Firebase emulators
              uses: actions/cache@v5
              with:
                  path: ~/.cache/firebase/emulators
                  # Lockfile hash included so a firebase-tools bump invalidates
                  # the cached jars instead of reusing stale ones.
                  key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
                  restore-keys: ${{ runner.os }}-firebase-emulators-
            # Only the Firestore emulator: these tests evaluate firestore.rules
            # over its REST API and need nothing else the suite starts.
            - run: npm run test:rules
              name: Run the security rules tests

    svelte-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            - run: npx svelte-kit sync
              name: Sync svelte-kit
            # --fail-on-warnings makes compiler a11y warnings block the merge:
            # each one must be fixed or explicitly svelte-ignored with a
            # rationale comment (see CLAUDE.md's Accessibility section).
            - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings .svelte-kit
              name: Run svelte-check

    locales:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            # Verifying the localized gallery examples re-derives 75 `.wp` files
            # per locale against their masters, which is most of this job. Nothing
            # a change leaves untouched can have gone stale, so the verifier skips
            # locales unchanged since this base — the same base, resolved the same
            # way, that the drift job gates on. Without it a shallow clone has no
            # `main` to compare against and the full pass runs.
            - name: Fetch the base commit
              run: |
                  BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
                  echo "WORDPLAY_LOCALES_BASE=$BASE" >> "$GITHUB_ENV"
                  git fetch --depth=1 origin "$BASE"
            - run: npm run locales
              name: Verify locales

    # A translation whose en-US source was reworded still describes the old
    # English, and nothing else notices — `$!` has to be typed by hand and almost
    # never is (#1144). This gates on the drift a change *introduces*, not the
    # absolute census: a reworded string whose translation was already correct
    # re-translates to identical bytes and leaves no trace in value history, so
    # a slice of the census can never clear and would be a permanently red build.
    # Scoping to the change also means one commit is enough, so no deep clone.
    drift:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            # The base to compare against: the PR's base commit, or the previous
            # tip of main on a push. Fetched one commit deep.
            - name: Fetch the base commit
              run: |
                  BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
                  echo "BASE=$BASE" >> "$GITHUB_ENV"
                  git fetch --depth=1 origin "$BASE"
            - run: npm run locales-drift -- --since "$BASE"
              name: Check that reworded en-US strings took their translations along

    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              name: Install dependencies
            # The local pre-commit hook auto-formats, but hooks can be bypassed
            # (--no-verify, GitHub web edits), so this is the backstop.
            # `npm run format` fixes any failure it reports.
            - run: npm run format:check
              name: Check formatting
