<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:url" content="https://wordplay.dev" />
        <meta property="og:type" content="website" />
        <meta
            name="title"
            property="og:title"
            content="Wordplay: Accessible, Multilingual, Programmable Typography"
        />
        <meta
            name="description"
            property="og:description"
            content="An educational programming language for creating interactive typographic media with code."
        />
        <meta
            name="image"
            property="og:image"
            content="https://wordplay.dev/icons/og-card.png"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="%wordplay.system.imageDescription%"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <!-- The SVG icon adapts to light/dark; the .ico and PNGs are
             fallbacks for browsers and crawlers that don't take SVG. -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="%sveltekit.assets%/icons/logo.svg"
        />
        <link
            rel="icon"
            sizes="48x48"
            href="%sveltekit.assets%/icons/favicon.ico"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="%sveltekit.assets%/icons/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="%sveltekit.assets%/icons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="%sveltekit.assets%/icons/favicon-16x16.png"
        />
        <!-- One manifest per locale, so an installed Wordplay is named in the
             language it was installed from. Substituted per prerendered page by
             hooks.server.ts, and kept current on unprefixed routes by the
             layout's language effect. -->
        <link rel="manifest" href="%wordplay.system.manifest%" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#ffffff"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#000000"
        />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!--
            Warm the DNS + TLS connection to Firestore so the first project
            getDoc (every database/shared project link falls through to one — see
            ProjectsDatabase.get) doesn't pay full connection setup on the
            critical path. crossorigin because Firestore requests are CORS; drop
            it if DevTools reports the preconnect as unused.
        -->
        <link
            rel="preconnect"
            href="https://firestore.googleapis.com"
            crossorigin
        />

        <!--
            Preload the regular + bold Latin Noto Sans slices — the text faces the
            loading overlay waits on before revealing the app (see +layout.svelte,
            which gates the reveal on `document.fonts.load('… "Noto Sans"')`). URLs
            must match the @font-face rules in /fonts.css exactly — including the
            crossorigin attribute — for the browser to reuse the preloaded bytes.

            The all-in-one Noto Emoji file (471 KB, font-display: block) is
            deliberately NOT preloaded: the overlay no longer waits on it, and
            Safari fails to reuse preloaded fonts for the @font-face request, so a
            preload there double-fetches the file (once for the preload, once on
            first emoji render) for no first-paint benefit. It now loads once, on
            demand, when emoji first render.
        -->
        <link
            rel="preload"
            href="/fonts/NotoSans/NotoSans-400-7.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/NotoSans/NotoSans-700-7.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <link rel="stylesheet" href="/fonts/fonts.css" />
        <!-- Lazy per-script Noto fallback faces; browsers download a slice
             only when rendered text intersects its unicode-range. -->
        <link rel="stylesheet" href="/fonts/fonts-fallback.css" />

        <style>
            :root {
                /* Light/dark palette pairs. Each raw value is authored exactly
                   once here, then composed by both the light-dark() block and
                   the legacy @media fallback below — so the light and dark
                   values can never drift apart the way the old duplicated dark
                   blocks did (they had, e.g. --color-dark-grey). */
                --blue-light: #648fff;
                --blue-dark: #3a72fe;
                /* Focus-indicator blue, split from --color-blue: the brand
                   blue misses WCAG 1.4.11's 3:1 non-text floor on light
                   backgrounds (2.74:1 on the alternating grey), and in dark
                   mode a focused button's white label on it misses 4.5:1.
                   These darker values pass both roles (light: 4.0:1 on white,
                   3.6:1 on alternating; dark: white text 4.8:1, 4.3:1 on
                   black) while block fills and other brand uses keep
                   --color-blue. Enforced by paletteContrast.test.ts. */
                --focus-blue-light: #4577f8;
                --focus-blue-dark: #2f66f5;
                --blue-transparent-light: color-mix(
                    in srgb,
                    var(--blue-light) 10%,
                    transparent
                );
                --blue-transparent-dark: #0f1e45;
                --purple-light: #785ef0;
                --purple-dark: #c7b4ff;
                --purple-transparent-light: color-mix(
                    in srgb,
                    var(--purple-light) 10%,
                    transparent
                );
                --purple-transparent-dark: #261862;
                --pink-light: #dc267f;
                --pink-dark: #ee68a9;
                --pink-transparent-light: color-mix(
                    in srgb,
                    var(--pink-light) 2%,
                    transparent
                );
                --pink-transparent-dark: rgb(77, 15, 45);
                --orange-light: #fe6100;
                --orange-dark: #ff5e00;
                --yellow-light: #c88800;
                --yellow-dark: #b67c00;
                --yellow-transparent-light: #ffb0004b;
                /* A selection or hover tint is a background for whatever it
                   covers, so its alpha is bounded by the dimmest text that can
                   sit on it — here a gold link, which is the same hue. At 4b
                   the composite over the dark page is #362400 and a link on it
                   measures 4.16:1, under AA; 38 gives 4.71:1. Light needs no
                   such bound: it already measures 4.69:1. */
                --yellow-transparent-dark: #b67c0038;
                --white-light: #ffffff;
                --white-dark: #000000;
                --black-light: #000000;
                --black-dark: #ffffff;
                --light-grey-light: #9f9f9f;
                --light-grey-dark: #6d6d6d;
                --very-light-grey-light: #f3f3f3;
                --very-light-grey-dark: #1e1e1e;
                --dark-grey-light: #303030;
                --dark-grey-dark: #e1e1e1;
                --shadow-light: rgb(0, 0, 0, 0.2);
                --shadow-dark: rgba(227, 227, 227, 0.8);
                --shadow-transparent-light: rgb(0, 0, 0, 0.05);
                --shadow-transparent-dark: rgba(227, 227, 227, 0.15);
                /* The surface of a control that is pressed in (Toggle's on state).
                   A step in from the background, and a bigger step in dark than
                   --very-light-grey-dark's #1e1e1e, which is indistinguishable from
                   a black page at button size. Deliberately not symmetric: near
                   black a small step reads as nothing, near white it reads at once. */
                --pressed-light: #dcdcdc;
                --pressed-dark: #3a3a3a;

                /* AA text variants. Colors rendered as *text* must meet WCAG
                   2.2 AA contrast (4.5:1) against --wordplay-background and
                   --wordplay-alternating-color, which the brand hues above
                   don't all reach in light mode. Each *-text pair keeps its
                   base hue but darkens the light value; backgrounds, borders,
                   and highlights keep the originals. Enforced by
                   paletteContrast.test.ts — update both when changing these. */
                --gold-text-light: #8a5f00;
                --gold-text-dark: #b67c00;
                --grey-text-light: #6b6b6b;
                --grey-text-dark: #8e8e8e;
                --blue-text-light: #3163d8;
                --blue-text-dark: #648fff;
                --orange-text-light: #b84800;
                --orange-text-dark: #ff5e00;

                /* Light defaults, valid on every browser. Modern browsers get
                   these overridden with light-dark() further down; browsers
                   without light-dark() keep these plus the @media dark fallback.
                   light-dark() must NOT live here — a browser that can't parse
                   it would treat var(--color-*) as an invalid color and break
                   every color that uses it. */
                --color-blue: var(--blue-light);
                --color-blue-transparent: var(--blue-transparent-light);
                --color-focus-blue: var(--focus-blue-light);
                --color-purple: var(--purple-light);
                --color-purple-transparent: var(--purple-transparent-light);
                --color-pink: var(--pink-light);
                --color-pink-transparent: var(--pink-transparent-light);
                --color-orange: var(--orange-light);
                --color-orange-transparent: #fe61004b;
                --color-yellow: var(--yellow-light);
                --color-yellow-transparent: var(--yellow-transparent-light);
                --color-white: var(--white-light);
                --color-black: var(--black-light);
                --color-light-grey: var(--light-grey-light);
                --color-light-grey-transparent: #9f9f9f36;
                --color-very-light-grey: var(--very-light-grey-light);
                --color-dark-grey: var(--dark-grey-light);
                --color-shadow: var(--shadow-light);
                --color-shadow-transparent: var(--shadow-transparent-light);
                --color-pressed: var(--pressed-light);
                --color-gold-text: var(--gold-text-light);
                --color-grey-text: var(--grey-text-light);
                --color-blue-text: var(--blue-text-light);
                --color-orange-text: var(--orange-text-light);

                /* Colors */
                --wordplay-foreground: var(--color-black);
                --wordplay-background: var(--color-white);
                --wordplay-header: var(--color-dark-grey);
                --wordplay-chrome: var(--color-light-grey);
                --wordplay-border-color: var(--color-light-grey);
                --wordplay-evaluation-color: var(--color-pink);
                /* A note sounding right now, filled behind the expression that
                   wrote it. Purple rather than the highlight gold because the
                   token text on this fill is painted --wordplay-background,
                   and white on gold measures 3.01:1 — under AA. Purple gives
                   4.51:1 light and 11.4:1 dark. Distinct from the evaluation
                   pink too, so a phrase animating while a melody plays doesn't
                   read as one thing. */
                --wordplay-sounding-color: var(--color-purple);
                --wordplay-highlight-color: var(--color-yellow);
                /* Link/term text color. The AA gold text variant, NOT the
                   highlight gold: gold as text needs 4.5:1 contrast, gold as
                   a background doesn't. Inherits, so a hovered interactive
                   element can flip it to the foreground to stay legible on the
                   gold hover background (see #1216). */
                --wordplay-link-color: var(--color-gold-text);
                --wordplay-focus-color: var(--color-focus-blue);
                --wordplay-hover: var(--color-yellow);
                --wordplay-hover-light: var(--color-yellow-transparent);
                /* What text must be painted in on a --wordplay-hover surface.
                   Literal black, not the mode-flipping --wordplay-foreground,
                   which is #ffffff in dark mode and measures 3.58:1 on this
                   gold. See .highlight-surface below for the full reasoning;
                   this is the same rule for the hovered state, which can't
                   carry a class. */
                --wordplay-hover-text: var(--black-light);
                /* The AA orange text variant works in both roles: as error
                   text on the background (5.3:1 light) and as an error
                   background under --wordplay-error-text-color (5.3:1 light,
                   6.9:1 dark). The brighter --color-orange passes neither in
                   light mode. */
                --wordplay-error: var(--color-orange-text);
                --wordplay-error-text-color: var(--color-white);
                --wordplay-warning: var(--color-yellow);
                /* Inactive/dimmed text uses the AA grey text variant; chrome
                   and borders keep --color-light-grey (non-text, no 4.5:1
                   requirement). */
                --wordplay-inactive-color: var(--color-grey-text);
                --wordplay-alternating-color: var(--color-very-light-grey);
                --wordplay-doc-color: var(--color-purple);
                --wordplay-doc-color-light: var(--color-purple-transparent);
                /* Token text colors use the AA orange text variant; error and
                   highlight backgrounds keep --color-orange. */
                --wordplay-relation-color: var(--color-orange-text);
                --wordplay-operator-color: var(--color-orange-text);
                --wordplay-type-color: var(--color-orange-text);

                /* Pastel fills for container-y block kinds. Mixed against the
                   background so they auto-track light/dark mode. */
                --wordplay-block-fill-definition: color-mix(
                    in srgb,
                    var(--color-blue) 15%,
                    var(--wordplay-background)
                );
                --wordplay-block-fill-predicate: color-mix(
                    in srgb,
                    var(--color-pink) 15%,
                    var(--wordplay-background)
                );
                --wordplay-block-fill-evaluate: color-mix(
                    in srgb,
                    var(--color-purple) 15%,
                    var(--wordplay-background)
                );
                --wordplay-block-fill-data: color-mix(
                    in srgb,
                    var(--color-yellow) 15%,
                    var(--wordplay-background)
                );
                --wordplay-block-fill-doc: color-mix(
                    in srgb,
                    var(--color-purple) 15%,
                    var(--wordplay-background)
                );
                --wordplay-block-fill-type: color-mix(
                    in srgb,
                    var(--color-orange) 15%,
                    var(--wordplay-background)
                );

                /* Fonts. Both chains end with the lazy per-script Noto
                   fallbacks (see static/fonts-fallback.css) so glyphs the
                   preloaded faces don't cover fall back to a downloaded-on-
                   demand script font instead of tofu. */
                --wordplay-app-font:
                    'Noto Sans', 'Noto Color Emoji', 'Noto Emoji',
                    var(--wordplay-fallback-fonts), sans-serif;
                --wordplay-code-font:
                    'Noto Sans Mono', 'Noto Sans', 'Noto Color Emoji',
                    'Noto Emoji', var(--wordplay-fallback-fonts), monospace;
                /* Canonical emoji font cascades, shared by Emoji.svelte and
                   EmojisRepaired.svelte. Ordinary color emoji lead with Noto Color
                   Emoji: Safari will NOT fall through a stack led by the OT-SVG
                   keycap face (it drops to the system Apple emoji), so keeping the
                   keycap face out of the general color cascade is required. The
                   keycap face is used ONLY for keycap/legacy runs (which need its
                   glyphs + GSUB ligatures), via --wordplay-emoji-keycap-font. */
                --wordplay-emoji-mono-font: 'Noto Emoji', 'Noto Sans';
                --wordplay-emoji-color-font:
                    'Noto Color Emoji', 'Noto Sans', sans-serif;
                --wordplay-emoji-keycap-font:
                    'Noto Emoji Keycap', 'Noto Color Emoji', 'Noto Sans';

                /* Spacing */
                --wordplay-editor-indent: 3em;
                --wordplay-editor-radius: 3px;
                --wordplay-spacing: 0.5rem;
                --wordplay-spacing-half: 0.25rem;
                /* The gutter column a chat reference's marker sits in, and the
                   marker's own target: WCAG 2.5.8's 24px floor. */
                --wordplay-marker-size: 24px;
                /* Block-editor density. Defaults match 'normal'; .editor.density-{compact|spacious} overrides below. */
                --wordplay-block-padding-block: 0.25rem;
                --wordplay-block-padding-inline: 0.25rem;
                --wordplay-block-insertion-margin: 0.25rem;
                --wordplay-block-stack-gap: var(--wordplay-spacing-half);
                --wordplay-font-weight: 400;
                --wordplay-font-size: 12pt;
                --wordplay-small-font-size: 10pt;
                --wordplay-border-width: 1px;
                --wordplay-focus-width: 4px;
                --wordplay-border-radius: 8px;
                --wordplay-code-line-height: 1.6;
                --wordplay-palette-min-width: 5em;
                --wordplay-palette-max-width: 15em;
                --wordplay-widget-height: 1.5em;
                --wordplay-min-line-height: 3ex;

                /* How much of the stage floor the two renderings that must not
                   be overlapped stand on (see MusicVisualizationOverlap).
                   Declared here rather than in each rendering because the floor
                   band has to clear whichever one the viewer chose, and separate
                   copies of these numbers drift. The ambient renderings have no
                   height here because nothing has to clear them. */
                --music-orchestra-height: 15%;
                --music-sheet-height: 34%;

                --bounce-height: 0.2em;
                --wobble-rotation: 2deg;

                /* The one selection look, shared by the editor (the output's name)
                   and the stage (the output itself) so the two visibly correspond.
                   See .selection-glow and @keyframes selectionglow below. */
                --selection-ring-width: var(--wordplay-focus-width);
                --selection-glow-blur: 16px;
                --selection-glow-offset: 6px;
                --selection-radius: var(--wordplay-border-radius);
                /* Selection is drawn dashed everywhere it appears, so it never
                   reads as the caret's solid highlight. The stage already used
                   a dash for "you could select this"; the same rhythm filled
                   in with the selection colour says "you did". */
                --selection-dash: 5px 4px;
                --selection-color: var(--wordplay-highlight-color);
                /* The editor's line vocabulary, so no meaning rides on hue
                   alone: solid = the caret's highlight and major conflicts,
                   dashed = selected output (above), dotted = minor conflicts,
                   and a small animated dash = exceptions. Dotted is distinct
                   from the selection dash on purpose — selection and warning
                   share the gold hue, so rhythm is what tells them apart. */
                --minor-severity-dots: 0 6px;

                --animation-factor: 1;
            }

            @media (prefers-reduced-motion: reduce) {
                :root {
                    --animation-factor: 0;
                }
            }

            /* Block-editor density overrides. Vertical compresses more aggressively
               than horizontal because 2px horizontal padding cramps adjacent tokens. */
            .editor.density-compact {
                --wordplay-block-padding-block: 0.125rem;
                --wordplay-block-padding-inline: 0.25rem;
                --wordplay-block-insertion-margin: 0.125rem;
                /* Compact blocks lose internal vertical padding, so add 1px to
                   the inter-block gap to keep stacked blocks visually distinct. */
                --wordplay-block-stack-gap: calc(
                    var(--wordplay-spacing-half) + 1px
                );
            }
            .editor.density-spacious {
                --wordplay-block-padding-block: 0.5rem;
                --wordplay-block-padding-inline: 0.5rem;
                --wordplay-block-insertion-margin: 0.5rem;
            }

            /* Modern browsers: color-scheme + light-dark() give the OS-driven
               default AND let JS force a mode by setting the color-scheme
               property on <html> (see +layout.svelte). All values come from the
               single-source pairs above, so there is nothing to keep in sync. */
            @supports (color: light-dark(#000, #fff)) {
                :root {
                    color-scheme: light dark;
                    --color-blue: light-dark(
                        var(--blue-light),
                        var(--blue-dark)
                    );
                    --color-blue-transparent: light-dark(
                        var(--blue-transparent-light),
                        var(--blue-transparent-dark)
                    );
                    --color-focus-blue: light-dark(
                        var(--focus-blue-light),
                        var(--focus-blue-dark)
                    );
                    --color-purple: light-dark(
                        var(--purple-light),
                        var(--purple-dark)
                    );
                    --color-purple-transparent: light-dark(
                        var(--purple-transparent-light),
                        var(--purple-transparent-dark)
                    );
                    --color-pink: light-dark(
                        var(--pink-light),
                        var(--pink-dark)
                    );
                    --color-pink-transparent: light-dark(
                        var(--pink-transparent-light),
                        var(--pink-transparent-dark)
                    );
                    --color-orange: light-dark(
                        var(--orange-light),
                        var(--orange-dark)
                    );
                    --color-yellow: light-dark(
                        var(--yellow-light),
                        var(--yellow-dark)
                    );
                    --color-yellow-transparent: light-dark(
                        var(--yellow-transparent-light),
                        var(--yellow-transparent-dark)
                    );
                    --color-white: light-dark(
                        var(--white-light),
                        var(--white-dark)
                    );
                    --color-black: light-dark(
                        var(--black-light),
                        var(--black-dark)
                    );
                    --color-light-grey: light-dark(
                        var(--light-grey-light),
                        var(--light-grey-dark)
                    );
                    --color-very-light-grey: light-dark(
                        var(--very-light-grey-light),
                        var(--very-light-grey-dark)
                    );
                    --color-dark-grey: light-dark(
                        var(--dark-grey-light),
                        var(--dark-grey-dark)
                    );
                    --color-shadow: light-dark(
                        var(--shadow-light),
                        var(--shadow-dark)
                    );
                    --color-shadow-transparent: light-dark(
                        var(--shadow-transparent-light),
                        var(--shadow-transparent-dark)
                    );
                    --color-pressed: light-dark(
                        var(--pressed-light),
                        var(--pressed-dark)
                    );
                    --color-gold-text: light-dark(
                        var(--gold-text-light),
                        var(--gold-text-dark)
                    );
                    --color-grey-text: light-dark(
                        var(--grey-text-light),
                        var(--grey-text-dark)
                    );
                    --color-blue-text: light-dark(
                        var(--blue-text-light),
                        var(--blue-text-dark)
                    );
                    --color-orange-text: light-dark(
                        var(--orange-text-light),
                        var(--orange-text-dark)
                    );
                }
            }

            /* Legacy fallback: browsers without light-dark() still get OS-driven
               dark mode (they can't honor a forced override — acceptable
               degradation). @supports-not gates it so modern browsers, which go
               dark via light-dark() above, never apply it — otherwise it would
               re-darken a user who forced light on an OS-dark machine. */
            @supports not (color: light-dark(#000, #fff)) {
                @media (prefers-color-scheme: dark) {
                    :root {
                        --color-blue: var(--blue-dark);
                        --color-blue-transparent: var(--blue-transparent-dark);
                        --color-focus-blue: var(--focus-blue-dark);
                        --color-purple: var(--purple-dark);
                        --color-purple-transparent: var(
                            --purple-transparent-dark
                        );
                        --color-pink: var(--pink-dark);
                        --color-pink-transparent: var(--pink-transparent-dark);
                        --color-orange: var(--orange-dark);
                        --color-yellow: var(--yellow-dark);
                        --color-yellow-transparent: var(
                            --yellow-transparent-dark
                        );
                        --color-white: var(--white-dark);
                        --color-black: var(--black-dark);
                        --color-light-grey: var(--light-grey-dark);
                        --color-very-light-grey: var(--very-light-grey-dark);
                        --color-dark-grey: var(--dark-grey-dark);
                        --color-shadow: var(--shadow-dark);
                        --color-shadow-transparent: var(
                            --shadow-transparent-dark
                        );
                        --color-pressed: var(--pressed-dark);
                        --color-gold-text: var(--gold-text-dark);
                        --color-grey-text: var(--grey-text-dark);
                        --color-blue-text: var(--blue-text-dark);
                        --color-orange-text: var(--orange-text-dark);
                    }
                }
            }

            @keyframes wobble {
                0% {
                    transform: rotate(var(--wobble-rotation));
                }
                50% {
                    transform: rotate(calc(-1 * var(--wobble-rotation)));
                }
                100% {
                    transform: rotate(var(--wobble-rotation));
                }
            }

            @keyframes throb {
                0% {
                    opacity: 0.8;
                }
                50% {
                    opacity: 1;
                }
                100% {
                    opacity: 0.8;
                }
            }

            @keyframes shift {
                0% {
                    transform: translateX(2px);
                }
                50% {
                    transform: translateX(-2px);
                }
                100% {
                    transform: translateX(2px);
                }
            }

            @keyframes bounce {
                0% {
                    transform: scale(1, 1) translateY(0);
                }
                10% {
                    transform: scale(1.1, 0.9) translateY(0);
                }
                30% {
                    transform: scale(0.9, 1.1)
                        translateY(calc(-1 * var(--bounce-height)));
                }
                50% {
                    transform: scale(1.05, 0.95) translateY(0);
                }
                57% {
                    transform: scale(1, 1) translateY(-7px);
                }
                64% {
                    transform: scale(1, 1) translateY(0);
                }
                100% {
                    transform: scale(1, 1) translateY(0);
                }
            }

            @keyframes ybounce {
                0% {
                    transform: scaleY(1) translateY(0);
                }
                10% {
                    transform: scaleY(0.9) translateY(0);
                }
                30% {
                    transform: scaleY(1.1)
                        translateY(calc(-1 * var(--bounce-height)));
                }
                50% {
                    transform: scaleY(0.95) translateY(0);
                }
                57% {
                    transform: scaleY(1) translateY(-7px);
                }
                64% {
                    transform: scaleY(1) translateY(0);
                }
                100% {
                    transform: scaleY(1) translateY(0);
                }
            }

            @keyframes pulse {
                0% {
                    stroke-width: var(--wordplay-focus-width);
                }

                70% {
                    stroke-width: var(--wordplay-border-width);
                }

                100% {
                    stroke-width: var(--wordplay-focus-width);
                }
            }

            @keyframes shake {
                10%,
                90% {
                    transform: translate3d(-1px, 0, 0);
                }

                20%,
                80% {
                    transform: translate3d(2px, 0, 0);
                }

                30%,
                50%,
                70% {
                    transform: translate3d(-4px, 0, 0);
                }

                40%,
                60% {
                    transform: translate3d(4px, 0, 0);
                }
            }

            @keyframes squish {
                10%,
                90% {
                    transform: translate3d(0, -1px, 0);
                }
                20%,
                80% {
                    transform: translate3d(0px, 2px, 0);
                }
                30%,
                50%,
                70% {
                    transform: translate3d(0, -4px, 0) scale(1, 1.25);
                }
                40%,
                60% {
                    transform: translate3d(0, 4px, 0) scale(1, 0.5);
                }
            }

            /* The shared "this output is selected" mark: a border with a glow that
               travels around its edges, one at a time. Drawn three ways — around each
               output on stage, as an inward frame on the output view when the Stage
               itself is selected, and around the output's code in the editor — so the
               three are legible as the same object.

               Three keyframes rather than one because the property differs by surface:
               box-shadow can't apply to an SVG path (the editor traces the node's shape,
               not a box) and an inward frame can't use outward offsets. They're kept in
               step by hand, and all read the same --selection-* values above, which is
               where drift would actually show.

               These animate the glow ALONE. The border is a dashed `outline` on each
               consumer, which no keyframe touches — a box-shadow ring here would paint
               a solid edge back over the dashes every frame, which is exactly what it
               used to do. Don't put the border back in the keyframes.

               Every consumer's base rule must carry a complete, visible border and glow
               on its own. An animation with a 0s duration — which is what
               --animation-factor: 0 (the calm setting, or OS reduced motion) produces —
               renders the base style rather than the 0% keyframe, so selection stays
               fully legible with motion switched off. */
            @keyframes selectionglow {
                0%,
                100% {
                    box-shadow: 0 calc(-1 * var(--selection-glow-offset))
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                25% {
                    box-shadow: var(--selection-glow-offset) 0
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                50% {
                    box-shadow: 0 var(--selection-glow-offset)
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                75% {
                    box-shadow: calc(-1 * var(--selection-glow-offset)) 0
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
            }

            /* The same travelling glow drawn inward, for a frame that has to stay
               inside its own bounds — the output view clips its overflow, so an
               outward ring and blur would be cut away entirely. Kept in step with
               `selectionglow` above by hand; both read the same variables. */
            @keyframes selectionglowinset {
                0%,
                100% {
                    box-shadow: inset 0 var(--selection-glow-offset)
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                25% {
                    box-shadow: inset calc(-1 * var(--selection-glow-offset)) 0
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                50% {
                    box-shadow: inset 0 calc(-1 * var(--selection-glow-offset))
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
                75% {
                    box-shadow: inset var(--selection-glow-offset) 0
                        var(--selection-glow-blur) 0 var(--selection-color);
                }
            }

            /* The same travelling glow for an SVG path, which box-shadow can't reach.
               drop-shadow's offsets interpolate the same way, so the light moves around
               the shape on the same cycle. The stroke itself is the border; this is only
               the glow around it. */
            @keyframes selectionglowdrop {
                0%,
                100% {
                    filter: drop-shadow(
                        0 calc(-1 * var(--selection-glow-offset))
                            var(--selection-glow-blur) var(--selection-color)
                    );
                }
                25% {
                    filter: drop-shadow(
                        var(--selection-glow-offset) 0
                            var(--selection-glow-blur) var(--selection-color)
                    );
                }
                50% {
                    filter: drop-shadow(
                        0 var(--selection-glow-offset)
                            var(--selection-glow-blur) var(--selection-color)
                    );
                }
                75% {
                    filter: drop-shadow(
                        calc(-1 * var(--selection-glow-offset)) 0
                            var(--selection-glow-blur) var(--selection-color)
                    );
                }
            }

            /* Applied by locale-preload.js when the preferred locale is not en-US,
               removed by +layout.svelte once the correct locale has loaded. */
            html.locale-loading > body {
                visibility: hidden;
            }

            body {
                background-color: var(--wordplay-background);
                padding: 0;
                margin: 0;
            }

            /* The app is a fixed-height shell whose panes scroll internally, so the
               document itself must never scroll. Without this, anything that escapes
               a pane (e.g. an absolutely positioned visually-hidden box) extends the
               document and the whole app — footer included — scrolls away. On iOS it
               also means Safari never collapses the URL bar, so `dvh` never changes
               mid-scroll and the app is never relaid out while the user is scrolling. */
            html,
            body,
            /* The wrapper SvelteKit's body renders into; the app's root is sized
               in percent, so this link in the chain needs a height too. */
            #wordplay-app {
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }

            html {
                box-sizing: border-box;
                /* iOS Safari's text autosizing inflates some blocks and not others,
                   which showed up as doc text rendering at a different size than the
                   code around it. Opt out; our sizes are already responsive. */
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
                /* iOS paints a translucent grey rectangle over the whole box of
                   whatever it considers tappable. Every control here already has
                   its own hover, active, focus, and selection feedback, so the
                   platform default only ever adds a stray box on top. */
                -webkit-tap-highlight-color: transparent;
                /* Chrome isn't body text: a select-all used to rake in tile names,
                   toolbar labels, and footer links along with the few things worth
                   copying. Selection is off by default and opted back in below, and
                   in MarkupHTMLView, ValueView, CreatorView, and PhraseView.
                   Every declaration in this scheme — the `none` here and every
                   opt-in — must carry BOTH spellings. WebKit still answers
                   `CSS.supports('user-select', 'none')` with false, so unprefixed
                   alone made the whole scheme inert in Safari; prefixing only some
                   of it makes a prefixed `none` beat an unprefixed opt-in and
                   silently swallow text that should be selectable. */
                user-select: none;
                -webkit-user-select: none;
            }

            * {
                box-sizing: inherit;
            }

            h1,
            h2,
            h3 {
                margin-bottom: var(--wordplay-spacing);
                margin-top: 0;
                transform: rotate(-1deg);
            }

            h1:not(:first-of-type),
            h2:not(:first-of-type),
            h3:not(:first-of-type) {
                margin-top: calc(2 * var(--wordplay-spacing));
                font-weight: bold;
            }

            h1 {
                font-size: calc(var(--wordplay-font-size) + 3pt);
            }

            h2 {
                font-size: calc(var(--wordplay-font-size) + 1pt);
            }

            h3 {
                font-size: var(--wordplay-font-size);
                font-style: italic;
                font-weight: normal;
            }

            p {
                margin-block-start: 0;
                margin-block-end: 1.5em;
            }

            p:last-child {
                margin-block-end: 0;
            }

            p,
            li {
                line-height: 1.5;
            }

            li:not(:last-of-type) {
                margin-block-end: var(--wordplay-spacing-half);
            }

            /* The elements that only ever hold content here: prose, the headings
               that title it, and tabular data. Links and inline markup inside them
               inherit, so they need no rule of their own. Deliberately not `code`
               (RootView renders a program inside one, and the editor draws its own
               selection) and not `li` (also used for grids of draggable previews;
               markup's own lists inherit from `.markup` instead). */
            p,
            h1,
            h2,
            h3,
            h4,
            h5,
            h6,
            td,
            th {
                user-select: text;
                -webkit-user-select: text;
            }

            /* WebKit stops honoring a field's own selection, and its editing, when
               an ancestor is `none`, so fields have to ask for it back. */
            input,
            textarea {
                user-select: text;
                -webkit-user-select: text;
            }

            *:focus {
                outline: var(--wordplay-focus-color) solid
                    var(--wordplay-focus-width);
            }

            body:focus {
                outline: none;
            }

            table {
                border-collapse: collapse;
                border: var(--wordplay-border-color) solid
                    var(--wordplay-border-width);
            }

            td,
            th {
                padding: var(--wordplay-spacing);
                text-align: start;
            }

            th {
                font-weight: normal;
                font-style: italic;
            }

            tr:nth-child(odd) {
                background: var(--wordplay-alternating-color);
            }

            noscript {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                gap: calc(var(--wordplay-spacing) / 3);
                font-family: var(--wordplay-app-font);
                color: var(--wordplay-foreground);
            }

            noscript h1 {
                font-size: min(10vw, 60pt);
                margin: 0;
                text-align: center;
            }

            noscript svg {
                /* The logo inherits noscript's foreground via currentColor,
                   so it adapts to light/dark with the text. */
                width: 0.9em;
                height: 0.9em;
                vertical-align: middle;
            }

            noscript p {
                margin: 0;
                max-width: 30rem;
                padding: var(--wordplay-spacing);
                text-align: center;
                font-size: var(--wordplay-font-size);
            }

            hr {
                width: 100%;
                height: var(--wordplay-border-width);
                border: none;
                border-bottom: var(--wordplay-border-width) solid
                    var(--wordplay-border-color);
            }

            a {
                color: var(--wordplay-link-color);
                /* Resting underline is invisible by default; surfaces where the
                   link color matches the background (see .highlight-surface) set
                   --wordplay-link-underline-color to reveal it. */
                text-decoration: calc(var(--wordplay-focus-width) / 2) underline
                    var(--wordplay-link-underline-color, transparent);
                /* In case a parent disables pointer events, we need to enable them here. */
                pointer-events: auto;
            }

            /* Links in paragraphs should have underlines for visibility. */
            p > a {
                text-decoration-color: var(
                    --wordplay-link-underline-color,
                    var(--wordplay-link-color)
                );
            }

            a:focus,
            a:hover {
                outline: none;
                text-decoration: underline;
                text-decoration-thickness: var(--wordplay-focus-width);
                text-decoration-color: var(--wordplay-focus-color);
            }

            /* Universal design for solid highlight-yellow surfaces. Apply to any
               container whose background is --wordplay-highlight-color.

               Both the text and the link colors are --black-light — literal
               black, not the mode-flipping --color-white, which is #ffffff in
               light and #000000 in dark. White on this gold measures 3.01:1,
               under the 4.5:1 AA minimum, and that is what shipped here; black
               passes in both modes (6.96:1 light, 5.87:1 dark). Toggle.svelte's
               .highlight had already worked this out and reached the opposite
               conclusion from this rule.

               The link color must be stated at all, rather than inherited,
               because --wordplay-link-color's dark value and this background
               are the same hex — #b67c00 — so an un-overridden link on gold is
               invisible at 1.00:1. The orange underline stays: it is the one
               cue that survives whatever the label does.

               It is currentColor rather than a literal, because a custom
               property keeps inheriting long after the background that
               justified it has been painted over: a descendant that repaints
               and resets `color` would otherwise keep a link color chosen for
               gold. currentColor makes the variable self-correcting — links are
               legible wherever their prose is, on every surface, in both
               schemes. */
            .highlight-surface {
                background: var(--wordplay-highlight-color);
                color: var(--black-light);
                --wordplay-link-color: currentColor;
                --wordplay-link-underline-color: var(--color-orange);
            }

            /* Two-band focus ring for surfaces the ring can't contrast with.

               CSS can't ask what color is painted behind a control, and
               background-color doesn't inherit, so there is nothing a control
               can query. The surface declares instead, and inheritance carries
               it down: any container that fills itself with a color the focus
               ring lands within 3:1 of adds this class, and every control
               inside gets a second band. The band is the page background,
               which contrasts with the focus blue at 4.0:1 light and 4.3:1
               dark no matter what the fill is, so the two bands together stay
               discernible on any surface — including in greyscale, where the
               blue-on-orange ring disappears entirely.

               It's drawn inset rather than as an outer shadow because 36
               components have an `overflow: hidden` ancestor that would clip
               an outer one; an inset band is inside the element and can't be
               clipped. Surfaces the ring already reaches 3:1 on (the page
               background, alternating rows, --wordplay-header) don't take this
               class and are unchanged.

               paletteContrast.test.ts lists which fills need it. */
            .saturated-surface,
            .highlight-surface {
                --wordplay-focus-band: inset 0 0 0 3px
                    var(--wordplay-background);
            }

            .saturated-surface :focus,
            .highlight-surface :focus {
                box-shadow: var(--wordplay-focus-band);
            }

            /* Links are the exception: their indicator is the thick underline
               above, not a ring, and an inset band on an inline box crops the
               glyphs it's drawn around. So they keep the underline and change
               only its color — currentColor is what the surface paints its
               prose in, so it's already at least 4.5:1 on the fill, where the
               focus blue is a luminance match for it.

               A filled surface needs a resting underline too (the link color
               is the prose color there, so the underline is the only thing
               marking it as a link), which leaves thickness alone carrying the
               state change — 2px to 4px, subtler than the invisible-to-4px
               change a link makes on the page background. Detaching the focus
               bar and running it solid through the descenders restores the
               difference without borrowing a ring's shape. */
            .saturated-surface a:focus,
            .highlight-surface a:focus {
                box-shadow: none;
                text-decoration-color: currentColor;
                text-decoration-skip-ink: none;
                text-underline-offset: 0.16em;
            }
        </style>

        %sveltekit.head%
    </head>
    <body>
        <noscript>
            <!--
                Styles inside <noscript> are only applied when JavaScript is
                disabled, so this hides the prerendered app and unsupported
                fallback so only the localized noscript message is visible.
            -->
            <style>
                #wordplay-app,
                #unsupported {
                    display: none !important;
                }
            </style>
            <!-- The logo mark (circle/triangle/square shapes face), inlined
                 because the %wordplay.*% substitutions are HTML-escaped text
                 only. Keep in sync with src/components/app/logoMark.ts. -->
            <h1>
                <svg viewBox="0 0 96 96" aria-hidden="true">
                    <path
                        d="M48 14C67.9 14 84 27.4 84 44C84 60.6 67.9 74 48 74C44.6 74 41.1 73.6 37.8 72.8C33 79 25 84 16 86C20.5 80.5 25 67.4 22 64.8C15.6 59.2 12 51.7 12 44C12 27.4 28.1 14 48 14Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3.5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />
                    <g fill="currentColor" transform="rotate(-8 48 44)">
                        <circle cx="29.25" cy="41" r="7" />
                        <polygon points="41.25,41 56.25,41 48.75,28" />
                        <rect x="61.25" y="38.5" width="12.5" height="12.5" />
                    </g></svg
                >%wordplay.wordplay%
            </h1>
            <p>%wordplay.system.noscript%</p>
        </noscript>
        <script src="/scripts/locale-preload.js"></script>
        <div id="wordplay-app">%sveltekit.body%</div>
        <div id="unsupported" style="display: none; margin: 1em">
            <h1>%wordplay.system.unsupportedHeading%</h1>
            <p>%wordplay.system.unsupportedBody%</p>
        </div>
        <script src="/scripts/unsupported.js"></script>
    </body>
</html>
